<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Don'tForget - Smart Departure Assistant{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "tertiary-fixed-dim": "#ccbeff",
                        "surface-container-highest": "#2d3449",
                        "outline": "#908fa0",
                        "surface-container-low": "#131b2e",
                        "primary-container": "#8083ff",
                        "on-primary": "#1000a9",
                        "on-surface-variant": "#c7c4d7",
                        "tertiary": "#ccbeff",
                        "primary-fixed": "#e1e0ff",
                        "inverse-surface": "#dae2fd",
                        "background": "#0b1326",
                        "outline-variant": "#464554",
                        "secondary": "#d0bcff",
                        "on-tertiary-fixed": "#1e0e4e",
                        "on-tertiary-container": "#2c1f5c",
                        "tertiary-fixed": "#e7deff",
                        "surface-variant": "#2d3449",
                        "on-secondary-container": "#c4abff",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#5516be",
                        "primary": "#c0c1ff",
                        "on-error": "#690005",
                        "on-primary-fixed": "#07006c",
                        "surface-container-high": "#222a3d",
                        "surface": "#0b1326",
                        "on-primary-container": "#0d0096",
                        "surface-dim": "#0b1326",
                        "on-background": "#dae2fd",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#c0c1ff",
                        "secondary-container": "#571bc1",
                        "surface-container": "#171f33",
                        "secondary-fixed-dim": "#d0bcff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "surface-container-lowest": "#060e20",
                        "error": "#ffb4ab",
                        "surface-tint": "#c0c1ff",
                        "on-tertiary-fixed-variant": "#4a3d7c",
                        "on-tertiary": "#332664",
                        "tertiary-container": "#9587cc",
                        "inverse-on-surface": "#283044",
                        "on-surface": "#dae2fd",
                        "inverse-primary": "#494bd6",
                        "secondary-fixed": "#e9ddff",
                        "surface-bright": "#31394d",
                        "on-secondary": "#3c0091",
                        "on-secondary-fixed": "#23005c"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "gutter-mobile": "1rem",
                        "space-lg": "1.5rem",
                        "space-xl": "2.5rem",
                        "margin-mobile": "1rem",
                        "margin": "2rem",
                        "space-sm": "0.5rem",
                        "space-md": "1rem",
                        "gutter": "1.5rem",
                        "space-xs": "0.25rem"
                    },
                    fontFamily: {
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"],
                        "headline-sm": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"]
                    },
                    fontSize: {
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "800"}],
                        "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "fontWeight": "800"}],
                        "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-xl-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "headline-sm": ["16px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "label-sm": ["10px", {"lineHeight": "12px", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui-polish.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <style>
        @layer base {
            html, body { margin: 0; padding: 0; }
            body { overscroll-behavior: none; }
            main > :first-child { margin-top: 0 !important; }
            main > :last-child { margin-bottom: 0 !important; }
        }
        ::-webkit-scrollbar { display: none; }
        .no-underline { text-decoration: none; }
    </style>
</head>
<body class="bg-background text-on-surface antialiased">
    <header class="fixed top-0 left-0 right-0 z-50 bg-surface-container-lowest/80 backdrop-blur-xl border-b border-outline-variant/20 shadow-[0_4px_20px_rgba(0,0,0,0.35)]">
        <div class="h-20 max-w-[1440px] mx-auto px-margin flex items-center justify-between gap-space-md">
            <div class="flex items-center gap-space-lg">
                <div class="flex items-center gap-space-sm">
                    <div class="flex flex-col">
                        <a href="{{ url_for('home') }}" class="font-headline-sm text-headline-sm text-on-surface font-bold tracking-tight no-underline">Don'tForget</a>
                        <span class="font-label-sm text-label-sm text-on-surface-variant font-medium tracking-wide uppercase">Smart Departure Assistant</span>
                    </div>
                </div>
                <nav class="hidden xl:flex items-center gap-space-xs p-space-xs bg-surface-container-low/60 rounded-xl">
                    <a href="{{ url_for('home') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Home</a>
                    <a href="{{ url_for('checklist') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Checklist</a>
                    <a href="{{ url_for('history') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">History</a>
                    <a href="{{ url_for('insights') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Insights</a>
                    <a href="{{ url_for('reminder') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Reminder</a>
                    <a href="{{ url_for('hardware') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Hardware</a>
                    <a href="{{ url_for('settings') }}" class="px-space-md py-space-sm rounded-lg font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">Settings</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content pt-24">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-surface-container text-on-surface-variant text-center py-6 mt-8">
        <p class="font-body-sm text-body-sm">Don'tForget - Smart Departure Assistant</p>
    </footer>
</body>
</html>
